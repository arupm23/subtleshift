[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subtleshift"
version = "0.1.0"
description = "Reproducible open-weight scaffolding for emergent-misalignment experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SubtleShift contributors"}]
dependencies = []

[project.optional-dependencies]
config = ["PyYAML>=6.0.2,<7"]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]
gpu = [
  "accelerate>=1.2,<2",
  "datasets>=3.2,<4",
  "peft>=0.14,<1",
  "torch>=2.5,<3",
  "transformers>=4.48,<5",
  "trl>=0.13,<1",
]

[project.scripts]
subtleshift = "subtleshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

